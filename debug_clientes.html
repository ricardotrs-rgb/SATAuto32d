<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug SAT32D Clientes</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1b2430;
      --accent: #0b5fb8;
      --accent-2: #0a3f73;
      --border: #d8e2ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #eaf2fb 0%, var(--bg) 52%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(16, 43, 79, 0.12);
    }

    .header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      flex: 1 1 280px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    a.link-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover,
    a.link-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: var(--accent-2);
      color: #fff;
    }

    iframe {
      width: 100%;
      height: min(74vh, 860px);
      border: 0;
      display: block;
      background: #fff;
    }

    .footer {
      padding: 12px 22px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: #4a5d74;
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="header">
      <h1>Debug local de SAT32D</h1>
      <div class="actions">
        <button id="reload" class="primary">Recargar vista</button>
        <a class="link-btn secondary" href="http://127.0.0.1:8000/clientes" target="_blank" rel="noopener noreferrer">
          Abrir en pestaña nueva
        </a>
      </div>
    </section>

    <iframe
      id="clientesFrame"
      src="http://127.0.0.1:8000/clientes"
      title="SAT32D Clientes"
      loading="eager"
      referrerpolicy="no-referrer"
    ></iframe>

    <section class="footer">
      Si no carga, verifica que la tarea "Run SAT32D Web" siga activa en VS Code.
    </section>
  </main>

  <script>
    const frame = document.getElementById("clientesFrame");
    const reloadBtn = document.getElementById("reload");

    reloadBtn.addEventListener("click", () => {
      frame.src = frame.src;
    });
  </script>
</body>
</html>
